# Quality-first PaddleX pipeline for PaddleOCR-VL-1.6 + llama-cpp-server.
# Selected when OCR_QUALITY_FIRST=true (see compose.yaml).
# Flags match modal-paddleocr: preprocessor, seal, image-block OCR,
# high-recall layout, keep headers/footnotes. Chart recognition stays off
# (enable via sidebar / USE_CHART_RECOGNITION). max_concurrency is rewritten
# at startup from LLAMA_N_PARALLEL.

pipeline_name: PaddleOCR-VL-1.6

batch_size: 64

use_queues: True

use_doc_preprocessor: True
use_layout_detection: True
# Off: same default as speed-first; tick the sidebar to enable per request.
use_chart_recognition: False
use_seal_recognition: True
use_ocr_for_image_block: True
format_block_content: False
merge_layout_blocks: True
# Empty list keeps headers, footnotes, page numbers, and asides in Markdown.
markdown_ignore_labels: []

SubModules:
  LayoutDetection:
    module_name: layout_detection
    model_name: PP-DocLayoutV3
    model_dir: null
    batch_size: 8
    threshold: 0.2
    layout_nms: False
    layout_unclip_ratio: [1.08, 1.12]
    layout_merge_bboxes_mode:
      0: "union" # abstract
      1: "union" # algorithm
      2: "union" # aside_text
      3: "union" # chart
      4: "union" # content
      5: "union" # display_formula
      6: "union" # doc_title
      7: "union" # figure_title
      8: "union" # footer
      9: "union" # footer
      10: "union" # footnote
      11: "union" # formula_number
      12: "union" # header
      13: "union" # header
      14: "union" # image
      15: "union" # inline_formula
      16: "union" # number
      17: "union" # paragraph_title
      18: "union" # reference
      19: "union" # reference_content
      20: "union" # seal
      21: "union" # table
      22: "union" # text
      23: "union" # text
      24: "union" # vision_footnote
  VLRecognition:
    module_name: vl_recognition
    model_name: PaddleOCR-VL-1.6-0.9B
    model_dir: null
    batch_size: 4096
    genai_config:
      backend: llama-cpp-server
      server_url: http://paddleocr-vlm-server:8080/v1
      max_concurrency: 8

SubPipelines:
  DocPreprocessor:
    pipeline_name: doc_preprocessor
    batch_size: 8
    use_doc_orientation_classify: True
    # Off: UVDoc unwarping produces crops that 500 llama.cpp (peg-native).
    use_doc_unwarping: False
    SubModules:
      DocOrientationClassify:
        module_name: doc_text_orientation
        model_name: PP-LCNet_x1_0_doc_ori
        model_dir: null
        batch_size: 8
      DocUnwarping:
        module_name: image_unwarping
        model_name: UVDoc
        model_dir: null

Serving:
  extra:
    max_num_input_imgs: null
