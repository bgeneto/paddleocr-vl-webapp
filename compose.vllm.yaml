# PaddleOCR-VL Document Parser with vLLM Backend
#
# Alternative stack. Default is llama.cpp via compose.yaml (`docker compose up -d`).
# Do not run both at once: they share STREAMLIT_HOST_PORT and typically the same GPU.
#
# This docker-compose file sets up a production-ready document OCR service using:
# - PaddleOCR-VL API service with layout detection
# - vLLM backend for accelerated VLM inference
# - Streamlit web interface for user interaction
#
# Requirements:
# - Docker >= 19.03
# - NVIDIA GPU with CUDA 12.6+ support
# - Compute Capability >= 8.0 for vLLM (RTX 30/40/50 series, A10, A100, etc.)
#
# Usage:
#   docker compose -f compose.vllm.yaml up -d
#   docker compose -f compose.vllm.yaml logs -f paddleocr-vlm-server
#   # Access the app at http://localhost:${STREAMLIT_HOST_PORT:-8501}

services:
  # Streamlit Web Application
  streamlit-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    # Must own ./data and ./logs. Set APP_UID/APP_GID in .env to `id -u`/`id -g`.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    container_name: paddleocr-vl-streamlit
    ports:
      - "${STREAMLIT_HOST_PORT:-8501}:8501"
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_THEME_BASE=light
      - DATA_DIR=${DATA_DIR:-/app/data}
      - DATA_CACHE_RETENTION_DAYS=${DATA_CACHE_RETENTION_DAYS:-45}
      # API Configuration
      - PADDLEOCR_VL_API_URL=http://paddleocr-vl-api:8080/layout-parsing
      - LLAMA_SERVER_URL=http://paddleocr-vlm-server:8080
      - API_TIMEOUT=${API_TIMEOUT:-300}
      # App Configuration
      - APP_TITLE=${APP_TITLE:-PaddleOCR-VL Document Parser}
      - APP_DESCRIPTION=${APP_DESCRIPTION:-Upload PDF or image files to convert them to Markdown using PaddleOCR-VL with vLLM backend}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-99}
      - MAX_PDF_PAGES=${MAX_PDF_PAGES:-250}
      - MAX_PARALLEL_PAGES=${MAX_PARALLEL_PAGES:-2}
      - MAX_PREVIEW_PAGES=${MAX_PREVIEW_PAGES:-10}
      - PAGES_PER_CHUNK=${PAGES_PER_CHUNK:-16}
      # Processing Options
      - USE_DOC_ORIENTATION_CLASSIFY=${USE_DOC_ORIENTATION_CLASSIFY:-false}
      - USE_DOC_UNWARPING=${USE_DOC_UNWARPING:-false}
      - USE_LAYOUT_DETECTION=${USE_LAYOUT_DETECTION:-true}
      - USE_CHART_RECOGNITION=${USE_CHART_RECOGNITION:-false}
      - PRETTIFY_MARKDOWN=${PRETTIFY_MARKDOWN:-true}
      - INCLUDE_PAGE_MARKERS=${INCLUDE_PAGE_MARKERS:-true}
      - VISUALIZE_RESULTS=${VISUALIZE_RESULTS:-false}
      - OCR_QUALITY_FIRST=${OCR_QUALITY_FIRST:-false}
    volumes:
      - ./app.py:/app/app.py:ro
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      paddleocr-vl-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ocr-network

  # PaddleOCR-VL API Service (Pipeline)
  paddleocr-vl-api:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl:${API_IMAGE_TAG_SUFFIX:-latest-offline}
    container_name: paddleocr-vl-api
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE_ID:-1}"]
              capabilities: [gpu]
    user: root
    restart: unless-stopped
    environment:
      - VLM_BACKEND=${VLM_BACKEND:-vllm}
      - OCR_QUALITY_FIRST=${OCR_QUALITY_FIRST:-false}
    volumes:
      - ./pipeline_config_vllm_quality.yaml:/home/paddleocr/pipeline_config_quality.yaml:ro
    command:
      - /bin/bash
      - -c
      - |
        if [ "$${OCR_QUALITY_FIRST:-false}" = "true" ]; then
          echo "[startup] OCR_QUALITY_FIRST=true; serving quality pipeline YAML"
          paddlex --serve --pipeline /home/paddleocr/pipeline_config_quality.yaml
        else
          paddlex --serve --pipeline /home/paddleocr/pipeline_config_$${VLM_BACKEND:-vllm}.yaml
        fi
    depends_on:
      paddleocr-vlm-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - ocr-network

  # VLM Inference Service (vLLM or FastDeploy)
  paddleocr-vlm-server:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-${VLM_BACKEND:-vllm}-server:${VLM_IMAGE_TAG_SUFFIX:-latest-nvidia-gpu-offline}
    container_name: paddleocr-vlm-server
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE_ID:-1}"]
              capabilities: [gpu]
    user: root
    restart: unless-stopped
    volumes:
      - ./vllm_config.yaml:/tmp/vllm_config.yaml:ro
    command: >
      paddleocr genai_server
      --model_name PaddleOCR-VL-1.6-0.9B
      --host 0.0.0.0
      --port 8080
      --backend ${VLM_BACKEND:-vllm}
      --backend_config /tmp/vllm_config.yaml
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s
    networks:
      - ocr-network

volumes:
  uploads:
    driver: local

networks:
  ocr-network:
    driver: bridge
